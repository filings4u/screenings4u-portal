<title>Notifications | Screenings4u</title><link rel="stylesheet" href="assets/css/admin-lms.css"><link rel="stylesheet" href="assets/css/admin-scheduling-config.css"></head>
<body data-schedule-page="notification"><div class="admin-lms-app"><aside id="admin-lms-sidebar-target"></aside><main class="admin-lms-main">
<header class="admin-lms-topbar"><button type="button" data-admin-sidebar-collapse>☰</button><div><strong>Screenings4u Management Portal</strong><span> / Administration</span></div><div><strong>Administrator</strong></div></header>
<section class="sched-page"><div class="sched-head"><div><a class="sched-back" href="admin-online-meetings.html">← Scheduling Calendar</a><h1>Notifications</h1><p>Configure customer, administrator, staff, and attendee messages for scheduling events.</p></div><button id="newBtn" class="btn btn-primary">+ New</button></div>
<div id="pageMessage" class="message" hidden></div><div id="loading" class="loading">Loading…</div><div id="cards" class="cards" hidden></div><div id="empty" class="empty" hidden><h2>Nothing configured yet</h2><p>Create the first item to continue building scheduling.</p></div>
<div id="backdrop" class="backdrop" hidden></div><section id="editor" class="modal" hidden><form id="editorForm"><div class="modal-head"><h2 id="modalTitle"></h2><button type="button" class="close" data-close>×</button></div><div class="modal-body"><input id="rowId" type="hidden"><div class="form-grid"><label class="field">Appointment type<select name="event_type_id" data-options="services" data-blank="All appointment types"></select></label><label class="field">Event<select name="event_name"><option value="booking_created">Booking created</option><option value="booking_confirmed">Booking confirmed</option><option value="booking_rescheduled">Booking rescheduled</option><option value="booking_cancelled">Booking cancelled</option><option value="reminder">Reminder</option><option value="completed">Completed</option><option value="no_show">No show</option></select></label><label class="field">Recipient<select name="recipient_type"><option value="customer">Customer</option><option value="admin">Administrator</option><option value="staff">Staff</option><option value="attendees">Attendees</option></select></label><label class="field">Minutes before <small>Used for reminders</small><input name="minutes_before" type="number" min="0"></label><label class="field full">Subject<input name="subject_template"></label><label class="field full">Message template<textarea name="body_template" rows="8"></textarea></label><label class="check"><input name="enabled" type="checkbox" checked> Enabled</label></div></div><div class="modal-foot"><button type="button" class="btn btn-secondary" data-close>Cancel</button><button class="btn btn-primary">Save</button></div></form></section></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script><script src="assets/js/core-auth.js"></script><script src="assets/js/ui.js"></script>
