<body data-schedule-page="waitlist"><div class="admin-lms-app"><aside id="admin-lms-sidebar-target"></aside><main class="admin-lms-main">

<section class="sched-page"><div class="sched-head"><div><a class="sched-back" href="admin-online-meetings.html">← Scheduling Calendar</a><h1>Waitlist</h1><p>Manage customers waiting for an appointment opening.</p></div><button id="newBtn" class="btn btn-primary">+ New</button></div>
